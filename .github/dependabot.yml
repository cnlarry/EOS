# 依赖更新：按量分组、每周一次，避免把维护者的通知淹没在逐包 PR 里。
# 注意 CONTRIBUTING 的约定：依赖有增减时要同步登记 THIRD-PARTY-NOTICES.md
# （组件、版本与许可），所以这类 PR 合入前需要人工看一眼那张表。
version: 2
updates:
  - package-ecosystem: nuget
    directory: /EOS.API
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-api:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /EOS.API.Tests
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-tests:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /EOS.Web
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
