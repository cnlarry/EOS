# 依赖更新：按量分组、每周一次，避免把维护者的通知淹没在逐包 PR 里。
# 注意 CONTRIBUTING 的约定：依赖有增减时要同步登记 THIRD-PARTY-NOTICES.md
# （组件、版本与许可），所以这类 PR 合入前需要人工看一眼那张表。
version: 2
updates:
  - package-ecosystem: nuget
    directory: /EOS.API
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-api:
        patterns: ["*"]
    ignore:
      # Microsoft.OpenApi 3.x 超出 Microsoft.AspNetCore.OpenApi 10.0.12 的依赖约束
      # （>= 2.12.0 && < 3.0.0），升上去就是 NU1608 且本仓把警告当错误 ⇒ 还原即失败。
      # 这不是我们能收口的版本冲突，等上游放开 3.x 再解除本条。
      # （QuestPDF 原先挡在 2026.9.1，其过时 API 适配已完成：Program.RegisterPdfFont 改用
      #  RegisterFontFromStream 并在启动时按字体文件里的族名核对，故那条已撤。）
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /EOS.API.Tests
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-tests:
        patterns: ["*"]
    ignore:
      # 同 EOS.API 条目（理由写在那边）：Microsoft.OpenApi 3.x 触 NU1608（上游约束 < 3.0.0）。
      # （QuestPDF 那条已撤：其过时 API 适配随本次升级一并落地。）
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /EOS.Web
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
