# 依赖更新：按量分组、每周一次，避免把维护者的通知淹没在逐包 PR 里。
# 注意 CONTRIBUTING 的约定：依赖有增减时要同步登记 THIRD-PARTY-NOTICES.md
# （组件、版本与许可），所以这类 PR 合入前需要人工看一眼那张表。
version: 2
updates:
  - package-ecosystem: nuget
    directory: /EOS.API
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-api:
        patterns: ["*"]
    ignore:
      # Microsoft.OpenApi 3.x 超出 Microsoft.AspNetCore.OpenApi 10.0.12 的依赖约束
      # （>= 2.12.0 && < 3.0.0），升上去就是 NU1608 且本仓把警告当错误 ⇒ 还原即失败。
      # 这不是我们能收口的版本冲突，等上游放开 3.x 再解除本条。
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # QuestPDF 2026.9.1 让 Program.cs 的 FontManager 调用变成过时 API，本仓把警告当错误；
      # 只挡这一个版本（它的版本号是日期式的，按 semver-major 挡会连未来所有版本一起挡死），
      # 等过时 API 的适配做完再放开。
      - dependency-name: "QuestPDF"
        versions: ["2026.9.1"]
  - package-ecosystem: nuget
    directory: /EOS.API.Tests
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-tests:
        patterns: ["*"]
    ignore:
      # 同 EOS.API 条目（理由写在那边）：Microsoft.OpenApi 3.x 触 NU1608（上游约束 < 3.0.0），
      # QuestPDF 2026.9.1 触发过时 API 而本仓把警告当错误。
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "QuestPDF"
        versions: ["2026.9.1"]
  - package-ecosystem: npm
    directory: /EOS.Web
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # 分组把 21 个包塞进一个 PR，其中三个是**跨大版本**的迁移，不能和补丁级升级一起合：
      #   · typescript 6 → 7、vitest 4 → 5（含 @vitest/coverage-v8）、jsdom 29 → 30
      # 这三类各自需要一次专门迁移（先跑通 tsc 与用例，再谈升）。此处按 semver-major 挡住，
      # 让同一分组里的补丁/次版本升级能单独落地；跨大版本那一批等专门任务时再放开。
      # （@tanstack/react-table 8 → 9 已落地：见 EOS.Web/src/lib/tanstackTable.ts 桥接层，故不再挡。）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      # 提交信息门禁按 `origin/main..HEAD` 扫整个 PR 的提交，而 Dependabot 默认标题
      # `Bump x and y others` 不是 Conventional Commits ⇒ 每个依赖 PR 都卡在门禁上。
      # 用规范前缀统一；已有的旧 PR 需要一次 `@dependabot recreate` 才会重新生成提交。
      prefix: "chore(deps)"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
