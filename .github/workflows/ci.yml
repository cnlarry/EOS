# 开源协作门禁。
#
# 外部贡献者很难在本地装齐 EOS 的全部环境（Windows + SQL Server 2025 + .NET 10 + Node），
# 没有 CI 时 PR 只能靠维护者拉下来手工验证，反馈慢且容易漏。这里跑的是**不需要数据库、
# 不需要 EOS.API 在线**的那部分：编译、离线单测、前端全套、以及一批静态门禁。
#
# 需要真库的用例（EOS.API.Tests 中带 Category=Integration 的一批）不在 CI 范围，
# 由维护者在本地跑，口径见 docs/guide/06-测试与质量门禁.md。
#
# 后端与门禁跑在 windows-latest：EOS.API 依赖 System.Drawing 的字体与条码渲染
# （见 EOS.API/EOS.API.csproj），且 scripts/ 下的门禁脚本按 Windows 路径拼接。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端（lint / build / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EOS.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EOS.Web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 静态检查
        run: npm run lint
      - name: 类型检查与构建
        run: npm run build
      - name: 单元测试
        run: npm test

  api:
    name: 后端（编译 / 离线测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # EOS.API 引用 third_party/agent-harness 里的 Agent Harness 源码（submodule，
          # 版本由 submodule 指针钉住，用于助手引擎的读路径灰度）。不取子模块时 solution 会因缺类型而编译失败。
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 编译
        run: dotnet build EOS.slnx -c Release
      # 真库用例标 Category=Integration（无连接串即失败，不能在无库的 runner 上跑），
      # 按需手工重跑的工具类标 Category=Tool（靠环境变量开关，不该在 CI 里触发）。
      # xUnit 的「!=」对没有该标签的用例判为满足，故这里是「排除这两类、其余全跑」。
      - name: 离线测试（不含真库用例与人工工具）
        run: dotnet test EOS.API.Tests/EOS.API.Tests.csproj -c Release --no-build --filter "Category!=Integration&Category!=Tool"

  gates:
    name: 静态门禁
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          # PR 下检出的是 GitHub 合成的 merge commit，而 GitHub 自动生成的合并提交必然
          # 不符合 Conventional Commits，会让提交信息门禁误报；改取 PR 分支头。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # 手册新鲜度按「文档与对应源码各自的最后一次提交」比较，浅克隆下 git log 取不到历史，
          # 会把所有篇目误判为新鲜（假绿）。提交信息门禁也要读区间内的提交。
          fetch-depth: 0
      - name: 控制器与效果处理器的 DI 注册
        run: ./scripts/check-di-registrations.ps1
      - name: 前端样式类
        run: ./scripts/check-css-classes.ps1
      # 页面外壳只有一套：JSX 里不得写死视口高度、手绘弹窗遮罩、手拼卡内工具条，
      # 也不得直接手写"统一组件才该产出的类名"（card erp-list-card / erp-data-table）——
      # 那正是「手抄了骨架却没复用组件」的特征。口径见 docs/guide/03 第七节。
      # 不带这条，规范就只是"谁记得谁跑"。
      - name: 前端页面外壳
        run: ./scripts/check-page-shell.ps1
      # 工作区导航只有一种写法：跨模块走 useOpenTab、返回回本模块列表。
      # 拦 navigate(-1)、back= 参数机制、window.open 打开应用内业务页——这三类退化编译与单测都照不出来，
      # 只表现为"点返回跳到别处 / 标签列表被另一个窗口覆盖"。口径见 docs/guide/03 第七节与 ADR-040。
      - name: 前端工作区导航
        run: ./scripts/check-tab-navigation.ps1
      - name: 数据层边界
        run: ./scripts/check-data-layer-boundary.ps1
      - name: 已退役库对象
        run: ./scripts/check-retired-db-objects.ps1
      - name: 迁移脚本数值列类型
        run: ./scripts/check-numeric-column-types.ps1
      - name: 迁移编号唯一性
        run: ./scripts/check-migration-numbers.ps1
      - name: 标识符白名单单入口
        run: ./scripts/check-identifier-single-source.ps1
      - name: 控制器边界（无内联 SQL）
        run: ./scripts/check-controller-sql-boundary.ps1
      # 控制器不做模块级权限决策：`IPermissionService` 声明自己是唯一入口，这条断言让声明可机检。
      # 存量 21 个控制器按具名冻结、只减不增（批 2 第 6 项逐条清空），新增即 FAIL。
      - name: 控制器边界（权限决策经 IPermissionService）
        run: ./scripts/check-controller-permission-boundary.ps1
      - name: 助手可代理动作注册表
        run: ./scripts/check-assistant-action-registry.ps1
      - name: 助手动作阈值与红线
        run: ./scripts/check-assistant-action-limits.ps1
      - name: 统一工作台策略层单入口
        run: ./scripts/check-workbench-policy-single-entry.ps1
      - name: Agent 技能引用
        run: ./scripts/check-agent-skills.ps1
      - name: 敏感信息文本
        run: ./scripts/check-sensitive-terms.ps1
      # 文档里的相对链接必须命中**已入库**的文件。本机用 .git/info/exclude 排除了 docs/*，
      # 于是"指向 docs/架构.md 这类本机专有文件"在本地一切正常、克隆下来是死链——
      # 这类问题本地看不见，只有换一台机器才暴露，故放进 CI 做硬门禁。
      - name: 文档一致性与链接
        run: ./scripts/check-docs.ps1
      # scripts/ 下积了几十个脚本，其中不少是一次性批次工具。这条门禁守住"每个脚本都写得出
      # 它干什么、且被某处引用过"（独立工具走白名单），并校验生成的台账与脚本目录一致——
      # 否则新增脚本会一路堆到没人说得清哪条还在生效。口径见 docs/guide/06 第五节。
      - name: 脚本台账
        run: ./scripts/script-inventory.ps1 -Check
      # 代码地图（后端路由 + 前端页面）同样"生成物 + 校验"：改了控制器或 workspaceRoutes.tsx
      # 而没重新生成即红；同时断言"解析条数 == 源码里的路由条数"，防解析器悄悄漏行。
      - name: 代码地图
        run: ./scripts/gen-code-map.ps1 -Check
      # 决策记录索引同样是"生成物 + 校验"：新增或改了 ADR 而没重新生成即红。
      - name: 决策记录索引
        run: ./scripts/gen-adr-index.ps1 -Check
      # 刻意不带 -Strict：它按 git 时间戳判定「源码动了、文档没动」，而改测试夹具、
      # 调 CI 参数这类不改变文档描述行为的改动也会命中。做成硬门禁只会逼出
      # 「为空过门禁而改文档」的动作；该不该补文档由维护者看日志里的落后清单判断。
      - name: 开发手册新鲜度（只提示）
        run: ./docs/guide/_tools/check-freshness.ps1
      - name: 提交信息
        if: github.event_name == 'pull_request'
        # 检出的 HEAD 取 PR 分支头（而非 GitHub 合成的 merge commit），
        # 否则区间里会混进一条自动生成的合并提交，格式必然不合规。
        # shell: pwsh 的当前目录是仓库根，无需切换。
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
          ./scripts/check-commit-msg.ps1 -Range "origin/${{ github.event.pull_request.base.ref }}..HEAD"
